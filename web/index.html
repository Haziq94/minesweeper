<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="The classic game, with a safe first click and chording. Plays offline.">
<title>Minesweeper</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minesweeper">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <h1 class="title">💣 Minesweeper</h1>
    <button type="button" id="settings-btn" class="icon" aria-label="Settings">⚙️</button>
  </header>

  <div class="bar">
    <div class="chip" id="counter">🚩 10</div>
    <button type="button" id="flag-mode" class="toggle" aria-pressed="false">🚩 Flag</button>
  </div>

  <p class="message" id="message" role="status"></p>

  <div class="panel">
    <div class="board" id="board"></div>
  </div>

  <button type="button" id="new-game" class="primary">🔄 New Game</button>

  <button type="button" id="install" class="install" hidden>📲 Install on this device</button>

  <p class="hint">Tap to dig · long-press (or right-click) to flag · tap a number to open its neighbours</p>
</div>

<dialog class="sheet" id="settings">
  <h2>⚙️ Settings</h2>
  <div class="fields">
    <label>Rows<input type="number" id="rows" min="5" max="30" step="1" value="10" inputmode="numeric"></label>
    <label>Columns<input type="number" id="cols" min="5" max="30" step="1" value="10" inputmode="numeric"></label>
    <label>Mines<input type="number" id="mines" min="1" step="1" value="10" inputmode="numeric"></label>
  </div>
  <div class="actions">
    <button type="button" id="cancel" class="ghost">Cancel</button>
    <button type="button" id="apply" class="primary">Apply &amp; restart</button>
  </div>
</dialog>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<script src="game.js"></script>
</body>
</html>
